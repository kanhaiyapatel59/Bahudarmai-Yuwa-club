<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/byc_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bahudarmai Yuwa Club (BYC) | Youth • Unity • Service • Progress</title>
    
    <!-- PWA Progressive Web App Metas for Mobile App Installation -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0055A5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BYC Club" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/byc_logo.jpg" />

    <!-- Google Fonts: Inter & Noto Sans Devanagari -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-[#02529C] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register PWA Service Worker for Mobile Home Screen Installation -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('BYC PWA Service Worker Registered:', reg.scope))
            .catch((err) => console.error('BYC PWA Registration Failed:', err));
        });
      }
    </script>
  </body>
</html>
